<aside
  class="fixed inset-y-0 left-0 z-50 flex w-64 flex-col bg-slate-950 text-white transition-transform duration-200 lg:translate-x-0"
  [class.translate-x-0]="mobileOpen"
  [class.-translate-x-full]="!mobileOpen"
>
  <div class="flex h-20 items-center gap-3 border-b border-white/10 px-6">
    <div
      class="flex h-11 w-11 items-center justify-center rounded-xl bg-blue-600 text-xl font-bold"
    >
      AI
    </div>

    <div>
      <h1 class="text-base font-bold">AI Banking</h1>
      <p class="text-xs text-slate-400">Workspace Platform</p>
    </div>
  </div>

  <nav
    class="flex-1 space-y-1 px-3 py-6"
    aria-label="Main navigation"
  >
    @for (item of navigation; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="bg-blue-600 text-white"
        [routerLinkActiveOptions]="{ exact: item.exact }"
        (click)="navigate.emit()"
        class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-slate-300 transition hover:bg-white/10 hover:text-white"
      >
        <span class="w-6 text-center text-xl">
          {{ item.icon }}
        </span>

        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="border-t border-white/10 p-5">
    <div class="rounded-xl bg-white/5 p-4">
      <p class="text-sm font-semibold">
        AI Banking Workspace
      </p>

      <p class="mt-1 text-xs text-slate-400">
        Development environment
      </p>
    </div>
  </div>
</aside>
